syntax = "proto3";
package pocket.gateway;

option go_package = "github.com/pokt-network/poktroll/x/gateway/types";
option (gogoproto.stable_marshaler_all) = true;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";

import "pocket/gateway/params.proto";
import "pocket/gateway/types.proto";

// Query defines the gRPC querier service.
service Query {

  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/pokt-network/poktroll/gateway/params";

  }

  // Queries a list of Gateway items.
  rpc Gateway    (QueryGetGatewayRequest) returns (QueryGetGatewayResponse) {
    option (google.api.http).get = "/pokt-network/poktroll/gateway/gateway/{address}";

  }
  rpc AllGateways (QueryAllGatewaysRequest) returns (QueryAllGatewaysResponse) {
    option (google.api.http).get = "/pokt-network/poktroll/gateway/gateway";

  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {

  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetGatewayRequest {
  string address = 1;

  // If true, strip Gateway.metadata (the card) from the response to reduce payload size.
  // Defaults to false, i.e. the card IS included -- proto3 bools cannot default to true.
  // Mirrors the same flag on the service queries.
  bool dehydrated = 2;
}

message QueryGetGatewayResponse {
  Gateway gateway = 1 [(gogoproto.nullable) = false];
}

message QueryAllGatewaysRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;

  // If true, strip Gateway.metadata (the card) from every entry in the response.
  // Defaults to false, i.e. cards ARE included -- proto3 bools cannot default to true.
  //
  // Enumerating gateways is where an included card hurts most: a card can be up to
  // MaxServiceMetadataSizeBytes (256 KiB), so a default page of 100 carried cards would be
  // ~25 MB and blow the 4 MB default gRPC message limit. Use this flag (or `pocketd query
  // gateway list-gateway --dehydrated`, which sets it) for bulk enumeration, and read an
  // individual card with `pocketd query gateway card <address>`.
  bool dehydrated = 2;
}

message QueryAllGatewaysResponse {
  repeated Gateway gateways = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

