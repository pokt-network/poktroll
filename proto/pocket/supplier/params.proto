syntax = "proto3";
package pocket.supplier;

option go_package = "github.com/pokt-network/poktroll/x/supplier/types";
option (gogoproto.stable_marshaler_all) = true;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "pocket/x/supplier/Params";
  option (gogoproto.equal) = true;

  // min_stake is the minimum amount of uPOKT that a supplier must stake to be
  // included in network sessions and remain staked.
  cosmos.base.v1beta1.Coin min_stake = 1 [(gogoproto.jsontag) = "min_stake", (gogoproto.moretags) = "yaml:\"min_stake\""];

  // staking_fee is the fee charged by the protocol for staking a supplier.
  cosmos.base.v1beta1.Coin staking_fee = 2 [(gogoproto.jsontag) = "staking_fee", (gogoproto.moretags) = "yaml:\"staking_fee\""];

  // min_stake_included_services is the number of services covered by min_stake.
  // Must be at least 1.
  uint64 min_stake_included_services = 3 [(gogoproto.jsontag) = "min_stake_included_services", (gogoproto.moretags) = "yaml:\"min_stake_included_services\""];

  // stake_per_additional_service is the additional stake required for each service
  // beyond min_stake_included_services. Zero disables the service cap.
  cosmos.base.v1beta1.Coin stake_per_additional_service = 4 [(gogoproto.jsontag) = "stake_per_additional_service", (gogoproto.moretags) = "yaml:\"stake_per_additional_service\""];
}
